<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900"><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8" fill="none" stroke="#34483d" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="#fffdf8"/><text x="55" y="55" text-anchor="start" font-family="Times New Roman,Songti SC,serif" font-size="30" fill="#263c31">领域类图补充：课程课表</text><text x="55" y="88" text-anchor="start" font-family="Times New Roman,Songti SC,serif" font-size="19" fill="#6f675c">Schedule以原始来源定位生成稳定ID；不根据星期擅自推算教学日期</text><rect x="60" y="300" width="330" height="200" rx="3" fill="#f0f5ef" stroke="#34483d" stroke-width="2"/><text x="225.0" y="332" text-anchor="middle" font-family="Times New Roman,Songti SC,serif" font-size="23" fill="#263c31">Course</text><path d="M60,348 H390" stroke="#34483d"/><text x="75" y="377" text-anchor="start" font-family="Times New Roman,Songti SC,serif" font-size="19" fill="#263c31">id / name</text><rect x="570" y="240" width="380" height="360" rx="3" fill="#f0f5ef" stroke="#34483d" stroke-width="2"/><text x="760.0" y="272" text-anchor="middle" font-family="Times New Roman,Songti SC,serif" font-size="23" fill="#263c31">Schedule</text><path d="M570,288 H950" stroke="#34483d"/><text x="585" y="317" text-anchor="start" font-family="Times New Roman,Songti SC,serif" font-size="19" fill="#263c31">id / weekday / periods</text><text x="585" y="344" text-anchor="start" font-family="Times New Roman,Songti SC,serif" font-size="19" fill="#263c31">startTime / endTime</text><text x="585" y="371" text-anchor="start" font-family="Times New Roman,Songti SC,serif" font-size="19" fill="#263c31">location / rawText / note</text><text x="585" y="398" text-anchor="start" font-family="Times New Roman,Songti SC,serif" font-size="19" fill="#263c31">version / source</text><rect x="1110" y="300" width="330" height="200" rx="3" fill="#f0f5ef" stroke="#34483d" stroke-width="2"/><text x="