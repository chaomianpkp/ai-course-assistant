<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1140" viewBox="0 0 1500 1140"><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8" fill="none" stroke="#34483d" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="#fffdf8"/><text x="55" y="55" text-anchor="start" font-family="Times New Roman,Songti SC,serif" font-size="30" fill="#263c31">顺序图：资料导入</text><text x="55" y="88" text-anchor="start" font-family="Times New Roman,Songti SC,serif" font-size="19" fill="#6f675c">非法批次在写入前拒绝；保存过程以单事务完成</text><rect x="15.0" y="125" width="170" height="65" rx="3" fill="#f0f5ef" stroke="#34483d" stroke-width="2"/><text x="100.0" y="164.5" text-anchor="middle" font-family="Times New Roman,Songti SC,serif" font-size="22" fill="#263c31">学生</text><path d="M100.0,190 L100.0,1090" fill="none" stroke="#34483d" stroke-width="2" stroke-dasharray="8 5"/><rect x="340.0" y="125" width="170" height="65" rx="3" fill="#f0f5ef" stroke="#34483d" stroke-width="2"/><text x="425.0" y="164.5" text-anchor="middle" font-family="Times New Roman,Songti SC,serif" font-size="22" fill="#263c31">资料页</text><path d="M425.0,190 L425.0,1090" fill="none" stroke="#34483d" stroke-width="2" stroke-dasharray="8 5"/><rect x="665.0" y="125" width="170" height="65" rx="3" fill="#f0f5ef" stroke="#34483d" stroke-width="2"/><text x="750.0" y="164.5" text-anchor="middle" font-family="Times New Roman,Songti SC,serif" font-size="22" fill="#263c31">HTTP控制器</text><path d="M750.0,190 L750.0,1090" fill="none" stroke="#34483d" stroke-width="2" stroke-dasharray="8 5"/><rect x="990.0" y="125" width="170" height="65" rx="3" fill="#f0f5ef" stroke="#34483d" stroke-width="2"/><text x="1075.0" y="164.5" text-anchor="middle" font-family="Times New Roman,Songti SC,serif" font-size="22" fill="#263c31">CourseImport</text><path d="M1075.0,190 L1075.0,1090" fill="none" stroke="#34483d" stroke-width="2" stroke-dasharray="8 5"/><rect x="1315.0" y="125" width="170" height="65" rx="3" fill="#f0f5ef" stroke="#34483d" stroke-width="2"/><text x="1400.0" y="164.5" text-anchor="middle" font-family="Times New Roman,Songti SC,serif" font-size="22" fill="#263c31">Repository</text><path d="M1400.0,190 L1400.0,1090" fill="none" stroke="#34483d" stroke-width="2" stroke-dasharray="8 5"/><path d="M100.0,245 L425.0,245" fill="none" stroke="#34483d" stroke-width="2" marker-end="url(#arrow)"/><text x="270.5" y="236.0" text-anchor="middle" font-family="Times New Roman,Songti SC,serif" font-size="18" fill="#263c31">确认输入</text><path d="M425.0,315 L750.0,315" fill="none" stroke="#34483d" stroke-width="2" marker-end="url(#arrow)"/><text x="595.5" y="306.0" text-anchor="middle" font-family="Times New Roman,Songti SC,serif" font-size="18" fill="#263c31">POST /api/imports</text><path d="M750.0,385 L1075.0,385" fill="none" stroke="#34483d" stroke-width="2" marker-end="url(#arrow)"/><text x="920.5" y="376.0" text-anchor="middle" font-family="Times New Roman,Songti SC,serif" font-size="18" fill="#263c31">parse(body)</text><path d="M1075.0,455 L750.0,455" fill="none" stroke="#34483d" stroke-width="2" stroke-dasharray="8 5" marker-end="url(#arrow)"/><text x="920.5" y="446.0" text-anchor="middle" font-family="Times New Roman,Songti SC,serif" font-size="18" fill="#263c31">校验通过；非法则400返回</text><path d="M750.0,525 L1400.0,525" fill="none" stroke="#34483d" stroke-width="2" marker-end="url(#arrow)"/><text x="1083.0" y="516.0" text-anchor="middle" font-family="Times New Roman,Songti SC,serif" font-size="18" fill="#263c31">save_import(bundle)</text><path d="M1400.0,595 L750.0,595" fill="none" stroke="#34483d" stroke-width="2" stroke-dasharray="8 5" marker-end="url(#arrow)"/><text x="1083.0" y="586.0" text-anchor="middle" font-family="Times New Roman,Songti SC,serif" font-size="18" fill="#263c31">提交后返回新增/更新/未变化数</text><path d="M750.0,665 L425.0,665" fill="none" stroke="#34483d" stroke-width="2" stroke-dasharray="8 5" marker-end="url(#arrow)"/><text x="595.5" y="656.0" text-anchor="middle" font-family="Times New Roman,Songti SC,serif" font-size="18" fill="#263c31">200 + 计数</text><path d="M425.0,735 L750.0,735" fill="none" stroke="#34483d" stroke-width="2" marker-end="url(#arrow)"/><text x="595.5" y="726.0" text-anchor="middle" font-family="Times New Roman,Songti SC,serif" font-size="18" fill="#263c31">GET /api/catalog</text><path d="M750.0,805 L1400.0,805" fill="none" stroke="#34483d" stroke-width="2" marker-end="url(#arrow)"/><text x="1083.0" y="796.0" text-anchor="middle" font-family="Times New Roman,Songti SC,serif" font-size="18" fill="#263c31">catalog()</text><path d="M1400.0,875 L750.0,875" fill="none" stroke="#34483d" stroke-width="2" stroke-dasharray="8 5" marker-end="url(#arrow)"/><text x="1083.0" y="866.0" text-anchor="middle" font-family="Times New Roman,Songti SC,serif" font-size="18" fill="#263c31">返回持久化资料与截止</text><path d="M750.0,945 L425.0,945" fill="none" stroke="#34483d" stroke-width="2" stroke-dasharray="8 5" marker-end="url(#arrow)"/><text x="595.5" y="936.0" text-anchor="middle" font-family="Times New Roman,Songti SC,serif" font-size="18" fill="#263c31">200 + 课程目录</text></svg>